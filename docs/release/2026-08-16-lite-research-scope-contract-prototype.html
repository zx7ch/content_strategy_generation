der:0;border-radius:999px;padding:8px 16px;background:#e8efe9;color:#51665a;font-size:14px;font-weight:500;cursor:pointer}.chip.selected{background:#789180;color:#fff}.text-input,.select-input{width:100%;height:44px;margin-top:14px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}.select-input{margin-top:7px}.structure-fields{display:grid;gap:12px;margin-top:16px;padding:12px;border-radius:12px;background:#f4f7f5}.structure-fields p{margin:0;color:var(--ink);font-weight:500}.field{display:grid;gap:4px;font-size:12px;font-weight:500}.field input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400;outline:none}.label{display:block;margin-top:16px;font-size:14px;font-weight:500}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dark-btn,.outline-btn,.green-btn,.amber-btn{border:0;border-radius:10px;padding:9px 16px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;cursor:pointer}.dark-btn:disabled,.outline-btn:disabled,.green-btn:disabled,.amber-btn:disabled{opacity:.4;cursor:not-allowed}.outline-btn{border:1px solid var(--line);background:#fff;color:var(--ink)}.green-btn{background:var(--green)}.scope-card{width:92%;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:#f0f2f5;color:var(--ink)}.scope-card .upper{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}.scope-card h2{margin:4px 0 0;font-size:16px}.scope-card .help{margin:4px 0 0;color:var(--quiet);font-size:12px;line-height:1.6}.query-card{display:block;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.query-card span{font-size:12px;font-weight:500}.query-card input{width:100%;margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;outline:none}.frozen-head{display:flex;align-items:center;justify-content:space-between}.saved{padding:4px 10 lay:block;margin-top:8px;color:var(--quiet)}.citation{display:inline-flex;margin-top:10px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.composer-area{padding:16px 24px;border-top:1px solid var(--line);background:#fff}.composer{max-width:768px;margin:auto;padding:16px 20px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 16px 48px rgba(15,23,42,.08);transition:.2s}.composer.research-mode{border-color:#93c5fd;box-shadow:0 0 0 4px #eff6ff,0 16px 48px rgba(15,23,42,.08)}.composer textarea{width:100%;min-height:42px;max-height:100px;resize:none;border:0;background:transparent;color:var(--ink);font-size:16px;line-height:1.7;outline:none}.composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.composer-tools{display:flex;align-items:center;gap:8px}.add{width:36px;height:36px;border:0;border-radius:50%;background:#fff;font-size:24px}.divider{width:1px;height:24px;background:var(--line)}.research-toggle{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:#fff;cursor:pointer}.research-toggle.active{border-color:var(--ink);background:#f1f5f9}.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;cursor:pointer}.send:disabled{opacity:.3}.context{width:300px;flex:0 0 auto;overflow-y:auto;padding:16px;border-left:1px solid var(--line);background:#f8fafc}.context h2{margin:0 0 12px;font-size:14px}.sidecard{margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.sidecard h3{margin:0;font-size:14px}.sidecard p{margin:5px 0 0;color:var(--quiet);font-size:12px;line-height:1.65}.stage-list{margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}.side-stage{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:7px 0;font-size:12px}.stage-dot{width:8px;height:8px;margin-top:6px;border-radius:50%;background:#4f6f5f}.side-stage strong{display:block}.side-stage p{margin:2px 0 0}.trace-link{width:100%;margin-top:12px;padding:12px 0 0;border:0;border-top:1px solid var(--line);background:#fff;color:#2563eb;text-align:left;font-size:12px;font-weight:650;cursor:pointer}.trace-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.trace-view{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.model-actions,.login-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.small-btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.login-title{display:flex;align-items:center;justify-content:space-between}.logged{color:#047857;font-size:12px}.cookie{width:100%;margin-top:5px;padding:7px 8px;border:1px solid var(--line);border-radius:8px}.login-primary{margin-top:12px;padding:7px 12px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:12px}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,6,23,.3)}.modal.open{display:flex}.trace-dialog{width:100%;max-width:576px;max-height:min(760px,calc(100vh - 48px));overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 24px 72px rgba(15,23,42,.2)}.trace-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--green);color:#fff}.trace-top h3{margin:0;font-size:16px}.trace-top p{margin:2px 0 0;color:rgba(255,255,255,.7);font-size:11px}.trace-top-actions{display:flex;gap:8px}.trace-top button{border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;padding:5px 10px;font-size:12px}.trace-progress{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--quiet);font-size:12px}.trace-content{max-height:600px;overflow:auto;padding:12px}.checkpoint-title{margin:0 0 8px;color:var(--quiet);font-size:12px;font-weight:650}.trace-row{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9}.trace-row i{width:8px;height:8px;margin-top:5px;border-radius:50%;background:#4f6f5f}.trace-row strong{display:block;font-size:13px}.trace-row p{margin:2px 0 0;color:var(--quiet);font-size:12px}.hidden{display:none!important}
    @media(max-width:1100px){.context{display:none}.shell{padding:0}.creator{border:0}}@media(max-width:760px){.threads{display:none}.feed{padding:16px}.top-inner{padding:0 16px}.brand,.workspace-scope{display:none}.brief-title h2{font-size:20px}.research-card,.brief-wrap,.scope-card,.report{width:100%}}

</head>
<body>
  <header class="top-nav"><div class="top-inner"><div class="top-left"><div class="workspace-name">品牌增长实验室</div><nav class="tabs"><span>工作台</span><span class="active">创作台</span></nav><div class="brand"><span>品牌</span><span class="brand-value">温和修护</span></div></div><div class="top-right"><span class="workspace-scope">Workspace scoped</span><span class="avatar">U</span></div></div></header>
  <div class="shell"><div class="creator">
    <aside class="threads" aria-label="对话历史"><button class="new-thread"><span>＋</span>新建对话</button><div class="thread-item active"><span class="title">夏季通勤长袖调研</span><span class="menu">···</span></div><div class="thread-item"><span class="title">春季通勤衬衫趋势</span></div><div class="thread-item"><span class="title">办公室穿搭选题</span></div><div class="thread-item"><span class="title">轻量户外装备测评</span></div></aside>
    <section class="chat"><div class="feed"><div class="messages" id="messages">
      <div class="message user"><div class="bubble">帮我调研春季通勤衬衫的内容趋势</div></div>
      <div class="message assistant"><article class="report" aria-label="Content Research published report"><header><p class="upper">研究结论</p><h3>春季通勤衬衫 · 调研结果</h3></header><div class="report-body"><p class="status-strip">1 个方向完成 · 3 条已验证发现 · 6 条样本观察 · 2 条线索</p><section class="report-section"><h4>场景与需求</h4><div class="finding"><p>换季温差使“可叠穿、抗皱、室内外切换”成为通勤内容的主要需求。</p><small>8 篇笔记 · 6 位独立作者</small><button class="citation">证据详情</button></div></section><section class="report-section"><h4>结论范围</h4><p>结论仅适用于本轮已冻结的春季通勤衬衫范围。</p></section></div></article></div>
    </div></div>
    <div class="composer-area"><div class="composer" id="composer"><textarea id="input" rows="1" placeholder="发消息..."></textarea><div class="composer-foot"><div class="composer-tools"><button class="add" aria-label="添加">+</button><span class="divider"></span><button class="research-toggle" id="research-toggle"><span>⌕</span>内容调研</button></div><button class="send" id="send" aria-label="发送" disabled>↑</button></div></div></div></section>
    <aside class="context" id="context" aria-label="内容调研上下文"></aside>
  </div></div>
  <section class="modal" id="trace-modal" aria-label="Content Research Trace"><div class="trace-dialog" role="dialog" aria-modal="true" aria-label="Agent 决策日志 · Trace"><div class="trace-top"><div><h3>查看调研过程</h3><p id="trace-subject"></p><p id="trace-run"></p></div><div class="trace-top-actions"><button id="refresh-trace">刷新</button><button id="close-trace" aria-label="关闭 Trace 对话框">×</button></div></div><div class="trace-progress" id="trace-progress"></div><div class="trace-content"><p class="checkpoint-title">结构与覆盖决策</p><div id="trace-rows"></div></div></div></section>
  <script>
  (function(){
    'use strict';
    const messages=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),toggle=document.getElementById('research-toggle'),composer=document.getElementById('composer'),context=document.getElementById('context');
    let researchMode=false,phase='runA',currentRun='run_A',traceOpenFor='run_A',collectionTimer=null,scopeQueries=['长袖衬衫','长袖衬衫 凉感','长袖衬衫 夏季通勤'];
    const traces={run_A:[['预检索完成','主体：春季通勤衬衫'],['Brief 已确认','产品营销 · 内容种草'],['检索范围已冻结','Scope v1 · 3 组检索词'],['小红书采集完成','24 条候选 · 18 条详情'],['报告已发布','完整核验报告']],run_B:[['预检索完成','主体：夏季通勤长袖']]};
    const reportAStatus='专家调研已完成，等待正式报告';
    function scrollEnd(){messages.lastElementChild?.scrollIntoView({behavior:'smooth',block:'end'})}
    function append(html,cls='assistant'){const box=document.createElement('div');box.className='message '+cls;box.innerHTML=html;messages.appendChild(box);scrollEnd();return box}
    function contextCard(){const runB=currentRun==='run_B';const published=phase==='report';const subject=runB?'夏季通勤长袖':'春季通勤衬衫';const status=runB?(published?'调研已完成':phase==='coverage'?'专家调研等待恢复':phase==='collecting'?'专家调研进行中':'调研 brief 已确认'):reportAStatus;const traceCount=traces[currentRun].length;
      context.innerHTML=`<h2>研究运行 / Trace</h2><section class="sidecard"><h3>${status}</h3><p>主体：${subject}</p>${published?`<div class="stage-list"><div class="side-stage"><i class="stage-dot"></i><div><strong>检索与筛选</strong><p>已完成并冻结证据。</p></div></div><div class="side-stage"><i class="stage-dot"></i><div><strong>研究结论</strong><p>已完整核验；请结合报告范围使用。</p></div></div></div>`:'<p style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">研究摘要将在正式报告发布后显示。</p>'}<button class="trace-link" data-open-trace>查看完整 workflow trace →</button></section><section class="sidecard"><div class="trace-head"><button style="border:0;background:#fff;padding:0;text-align:left"><h3>证据与 Trace</h3><p>${traceCount} 条执行记录 · ${status}</p></button><button class="trace-view" data-open-trace>查看 Trace</button></div></section><h2>本次研究摘要</h2><section class="sidecard"><p>${published?'4 条冻结引用<br>3 条已准入发现<br>1 个请求方向状态<br>1 条初步信号':'暂无已发布报告；此处不会显示未冻结的来源、结论或指标。'}</p></section><section class="sidecard" aria-label="模型服务"><h3>模型服务</h3><p>连接已验证</p><p>模型：gpt-4o-mini</p><p>来源：用户配置</p><div class="model-actions"><button class="small-btn">配置模型</button></div></section><section class="sidecard" aria-label="小红书登录"><div class="login-title"><h3>小红书登录</h3><span class="logged">已登录</span></div><p>方式：Cookie；重启 Runtime 后仍会保留。</p><p>更新于：2026/8/23 09:30:00</p><button class="login-primary">扫码登录</button><label class="label" for="xhs-cookie">粘贴 Cookie</label><input class="cookie" id="xhs-cookie" type="password" placeholder="粘贴完整 Cookie"><div class="login-actions"><button class="small-btn" disabled>保存 Cookie</button><button class="small-btn">清除</button></div></section>`;
      context.querySelectorAll('[data-open-trace]').forEach(b=>b.addEventListener('click',()=>openTrace(currentRun)))}
    function openTrace(run){traceOpenFor=run;document.getElementById('trace-subject').textContent=`「${run==='run_A'?'春季通勤衬衫':'夏季通勤长袖'}」`;document.getElementById('trace-run').textContent=`workflow_run · ${run}`;document.getElementById('trace-progress').textContent=`当前进度：${run==='run_A'?reportAStatus:phase==='report'?'专家调研已完成，等待正式报告':phase==='coverage'?'专家调研等待恢复':phase==='collecting'?'专家调研进行中':'调研 brief 已确认'}`;document.getElementById('trace-rows').innerHTML=traces[run].slice().reverse().map(x=>`<div class="trace-row"><i></i><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('');document.getElementById('trace-modal').classList.add('open')}
    function escapeHtml(text){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function userMessage(text){append(`<div class="bubble">${escapeHtml(text)}</div>`,'user')}
    function showBrief(){phase='brief';append(`<div class="brief-wrap"><div class="brief-title"><div class="brief-icon">⌕</div><div><h2>在开始前，请确认几个关键点</h2><p>这能帮助专家团队更精准地锁定调研范围</p></div></div><div class="brief-card"><p class="eyebrow">你的需求</p><p style="margin-top:12px;font-size:18px;color:var(--ink);font-weight:500">夏季通勤长袖</p></div><div class="brief-card"><h3>我们识别到你要调研的是「夏季通勤长袖」。是否准确？</h3><p style="color:#94a3b8">若不准确，请直接在底部对话框补充说明。</p><div class="chips" id="subject-chips"><button class="chip" data-subject="yes">准确，继续</button><button class="chip" data-subject="mostly">大致准确，下面补充</button><button class="chip" data-subject="no">不准确，我在下方说明</button></div></div><div class="brief-card"><h3>为「夏季通勤长袖」自动发现了以下候选竞品，请勾选你希望重点对比的对象（可多选）：</h3><p>勾选后会纳入本轮对比；是否能形成结论取决于可获得的公开证据。</p><div class="chips"><button class="chip">优衣库</button><button class="chip">蕉下</button><button class="chip">待补充竞品</button></div><input class="text-input" placeholder="补充其他想调研的竞品，回车添加（可用逗号分隔多个）"></div><div class="brief-card"><h3>请选择本轮调研方向（可多选）：</h3><div class="chips" id="direction-chips"><button class="chip" data-direction="product">产品营销</button><button class="chip">竞品发现</button><button class="chip">内容表现</button></div><div class="actions"><button class="dark-btn" id="confirm-brief" disabled>确认并继续</button></div></div></div>`);wireBrief();contextCard()}
    function wireBrief(){let subject=false,direction=false;const confirm=document.getElementById('confirm-brief');function refresh(){confirm.disabled=!(subject&&direction)}document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-subject]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');subject=true;refresh()}));document.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('selected');direction=b.classList.contains('selected');refresh()}));confirm.addEventListener('click',confirmBrief)}
    function confirmBrief(){phase='scope';currentRun='run_B';traces.run_B.push(['Brief 已确认','产品营销']);append(`<div class="bubble">调研 brief 已确认，请确认本轮最终检索词。</div>`);append(`<section class="scope-card" id="scope-card"><p class="upper">检索范围确认</p><h2>确认每组最终检索词</h2><p class="help">以下是本轮实际发送给小红书的检索词。确认后将冻结并开始采集；你可以在此直接修改。</p>${scopeQueries.map((query,index)=>`<label class="query-card"><span>检索组 ${index+1}</span><input value="${escapeHtml(query)}"></label>`).join('')}<div class="actions"><button class="dark-btn" id="confirm-scope">确认并开始调研</button></div></section>`);const scopeFields=Array.from(document.querySelectorAll('#scope-card .query-card input')),scopeConfirm=document.getElementById('confirm-scope');function refreshScope(){scopeConfirm.disabled=scopeFields.some(field=>!field.value.trim())}scopeFields.forEach(field=>field.addEventListener('input',refreshScope));scopeConfirm.addEventListener('click',confirmScope);refreshScope();contextCard()}
    function frozenScope(extra=''){const roles=['覆盖检索','探索检索','探索检索'];return `<section class="scope-card" id="scope-card"><div class="frozen-head"><div><p class="upper">已冻结检索范围</p><h2>Scope v1</h2></div><span class="saved">服务端已保存</span></div>${scopeQueries.map((query,index)=>`<div class="query-frozen"><div class="query-meta"><span>检索组 ${index+1}</span><span class="role">${roles[index]}</span></div><p>${escapeHtml(query)}</p></div>`).join('')}${extra}</section>`}
    function replaceScope(html){const old=document.getElementById('scope-card');if(old){const wrap=document.createElement('div');wrap.innerHTML=html;old.replaceWith(wrap.firstElementChild)}}
    function confirmScope(){scopeQueries=Array.from(document.querySelectorAll('#scope-card .query-card input')).map(field=>field.value.trim());phase='collecting';traces.run_B.push(['检索范围已冻结',`Scope v1 · ${scopeQueries.length} 组检索词`],['执行单元处理中','尝试 1']);append(`<div class="bubble">检索范围已冻结，正在开始内容调研。</div>`);replaceScope(frozenScope('<p class="processing">执行单元处理中 · 尝试 1</p>'));contextCard();collectionTimer=setTimeout(showCoverage,1100)}
    function showCoverage(){phase='coverage';traces.run_B.push(['覆盖评估完成','夏季条件样本覆盖不足']);replaceScope(frozenScope(`<div class="coverage-box"><h3>样本覆盖不足，需要你决定下一步</h3><p>范围已锁定，普通范围确认不可用。这里只显示服务端允许的处理方式。</p><p>“夏季”必要条件覆盖不足。</p><div class="coverage-actions"><button class="amber-btn" id="expand">继续补充夏季样本</button><button class="outline-btn" id="limited">基于现有证据生成受限报告</button><button class="outline-btn" id="relax">放宽夏季约束</button></div><div class="supplement hidden" id="supplement"><p>补搜只针对服务端声明的未满足条件，不会修改已确认 Scope。</p><input value="长袖衬衫 高温通勤"><input placeholder="补充检索词 2（可选）"><button class="amber-btn" id="submit-expand" style="margin-top:12px">提交补搜决定</button></div></div>`));document.getElementById('expand').addEventListener('click',()=>document.getElementById('supplement').classList.remove('hidden'));document.getElementById('submit-expand').addEventListener('click',()=>publish('expand'));document.getElementById('limited').addEventListener('click',()=>publish('limited'));document.getElementById('relax').addEventListener('click',()=>publish('relax'));contextCard()}
    function publish(decision){phase='report';const limited=decision==='limited';traces.run_B.push([decision==='expand'?'补搜决定已执行':decision==='relax'?'范围放宽决定已执行':'受限报告决定已保存',decision==='expand'?'沿用 Scope v1 · 新执行单元':decision==='relax'?'Scope v2 · 夏季改为偏好':'Scope v1 · Coverage v1'],['报告已发布',limited?'部分内容已核验':'已完整核验']);document.getElementById('scope-card')?.remove();append(`<article class="report" aria-label="Content Research published report"><header><p class="upper">研究结论</p><h3>夏季通勤长袖 · 调研结果</h3></header><div class="report-body"><p class="status-strip">1 个方向完成 · 3 条已验证发现 · 4 条样本观察 · 1 条线索</p>${limited?'<p class="warning" style="margin:0">夏季样本覆盖不足；以下结论仅基于已满足全部必要条件的现有证据。</p>':''}<section class="report-section"><h4>场景与需求</h4><div class="finding"><p>轻薄、透气和不易皱，是夏季通勤长袖内容中反复出现的核心需求。</p><small>${limited?'5':'14'} 篇笔记 · 4 位独立作者</small><button class="citation">证据详情</button></div></section><section class="report-section"><h4>可被相信的产品卖点</h4><div class="finding"><p>“高温通勤仍保持利落”适合作为首轮内容测试方向。</p><small>结论仅适用于报告声明的检索范围。</small></div></section></div></article>`);contextCard()}
    function beginRunB(){phase='brief';append(`<div class="bubble">我会先做一次轻量预检索，确认你要研究的主体、竞品范围和调研方向。这个阶段不会生成正式结论。</div>`);setTimeout(showBrief,350)}
    toggle.addEventListener('click',()=>{researchMode=!researchMode;toggle.classList.toggle('active',researchMode);composer.classList.toggle('research-mode',researchMode);input.placeholder=researchMode?'输入品类、品牌或 SKU，发送后开始内容调研':'发消息...';input.focus()});input.addEventListener('input',()=>send.disabled=!input.value.trim());input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});send.addEventListener('click',()=>{const text=input.value.trim();if(!text)return;userMessage(text);input.value='';send.disabled=true;if(researchMode){researchMode=false;toggle.classList.remove('active');composer.classList.remove('research-mode');input.placeholder='发消息...';beginRunB()}});document.getElementById('close-trace').addEventListener('click',()=>document.getElementById('trace-modal').classList.remove('open'));document.getElementById('trace-modal').addEventListener('click',e=>{if(e.target.id==='trace-modal')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('trace-modal').classList.remove('open')});document.getElementById('refresh-trace').addEventListener('click',()=>openTrace(traceOpenFor));contextCard();
  })();
  </script>
</body>
</html>
