name: Build & Release

# Triggered by pushing a version tag: git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ── Guard: verify tag version matches pyproject.toml ──────────────────────
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: echo "tag_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract version from pyproject.toml
        id: get
        run: |
          version=$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              content = f.read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          print(m.group(1))
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches pyproject.toml
        run: |
          tag="${{ steps.tag.outputs.tag_version }}"
          pkg="${{ steps.get.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "❌ Tag v$tag does not match pyproject.toml version $pkg"
            echo "   Update pyproject.toml before tagging."
            exit 1
          fi
          echo "✅ Version $pkg verified"

  # ── Build matrix ────────────────────────────────────────────────────────────
  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (arm64)
            artifact: xhs-runtime-macos-arm64
          - os: macos-13       # Intel (x86_64)
            artifact: xhs-runtime-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Dependency caching ─────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      # ── Install ────────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run deterministic release gate
        run: RELEASE_GATE_PHASE=prebuild ./scripts/run_release_gate.sh

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller runtime_main.spec

      # ── Package ───────────────────────────────────────────────────────────
      - name: Create archive
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip xhs-runtime/
          echo "Archive size: $(du -sh ../${{ matrix.artifact }}.zip | cut -f1)"

      - name: Verify frozen release artifact
        env:
          RELEASE_ARCHIVE_PATH: ${{ matrix.artifact }}.zip
          RELEASE_GATE_REQUIRE_ARTIFACT: '1'
          RUN_FROZEN_RUNTIME_RESTART_GATE: '1'
        run: RELEASE_GATE_PHASE=artifact ./scripts/run_release_gate.sh

      # ── Upload to GitHub Release ───────────────────────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.verify-version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.artifact }}.zip
