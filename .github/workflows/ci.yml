name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: pip-ubuntu-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Lint (ruff)
        run: >-
          ruff check
          app/content_research
          app/main.py
          app/services/xhs_credentials.py
          app/services/xhs_qr_auth.py
          app/services/xhs_spider.py
          runtime_main.py
          tests/unit/test_runtime_config_migration.py
          tests/unit/test_runtime_launcher.py
          tests/unit/test_package_metadata.py
          tests/unit/test_xhs_credentials.py
          tests/unit/test_xhs_qr_auth.py
          tests/e2e/test_xhs_login_api.py
          tests/e2e/test_xhs_qr_login_api.py
          tests/unit/test_content_research_*.py
          tests/e2e/test_content_research_*.py
          --output-format=github

      - name: Collect all Python tests in a clean environment
        run: pytest --collect-only tests/ -q

      - name: Unit tests
        run: >-
          pytest
          tests/unit/test_content_research_*.py
          tests/unit/test_runtime_config_migration.py
          tests/unit/test_runtime_launcher.py
          tests/unit/test_package_metadata.py
          tests/unit/test_xhs_credentials.py
          tests/unit/test_xhs_qr_auth.py
          tests/e2e/test_content_research_brief_confirm_api.py
          tests/e2e/test_content_research_formal_workflow_e2e.py
          tests/e2e/test_content_research_model_configuration_api.py
          tests/e2e/test_content_research_presearch_api.py
          tests/e2e/test_content_research_report_publication_timeline_api.py
          tests/e2e/test_content_research_trace_api.py
          tests/e2e/test_xhs_login_api.py
          tests/e2e/test_xhs_qr_login_api.py
          -v --tb=short -q
