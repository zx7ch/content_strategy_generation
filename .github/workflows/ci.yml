name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: pip-ubuntu-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Lint (ruff)
        run: >-
          ruff check
          app/content_research
          app/main.py
          app/services/xhs_credentials.py
          app/services/xhs_qr_auth.py
          app/services/xhs_spider.py
          runtime_main.py
          tests/unit/test_runtime_config_migration.py
          tests/unit/test_runtime_launcher.py
          tests/unit/test_package_metadata.py
          tests/unit/test_xhs_credentials.py
          tests/unit/test_xhs_qr_auth.py
          tests/e2e/test_xhs_login_api.py
          tests/e2e/test_xhs_qr_login_api.py
          tests/unit/test_content_research_*.py
          tests/e2e/test_content_research_*.py
          --output-format=github

      - name: Collect all Python tests in a clean environment
        run: pytest --collect-only tests/ -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Content Research prebuild release gate
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: RELEASE_GATE_PHASE=prebuild bash scripts/run_release_gate.sh
